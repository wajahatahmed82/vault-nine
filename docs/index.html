<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VAULT NINE">
<meta name="theme-color" content="#0b1017">
<meta name="description" content="A story-driven tactical shooter. Investigate a silent research station, uncover what was buried in Vault Nine, and get out alive.">
<meta property="og:title" content="VAULT NINE">
<meta property="og:description" content="A story-driven tactical shooter. Investigate a silent research station, uncover what was buried in Vault Nine, and get out alive.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='18'%20fill='%230b1017'/%3E%3Cg%20fill='none'%20stroke='%237fe9c4'%20stroke-linecap='round'%3E%3Ccircle%20cx='50'%20cy='50'%20r='38'%20stroke-width='6'/%3E%3Cg%20stroke-width='5'%3E%3Cline%20x1='50'%20y1='50'%20x2='50.0'%20y2='20.0'/%3E%3Cline%20x1='50'%20y1='50'%20x2='69.3'%20y2='27.0'/%3E%3Cline%20x1='50'%20y1='50'%20x2='79.5'%20y2='44.8'/%3E%3Cline%20x1='50'%20y1='50'%20x2='76.0'%20y2='65.0'/%3E%3Cline%20x1='50'%20y1='50'%20x2='60.3'%20y2='78.2'/%3E%3Cline%20x1='50'%20y1='50'%20x2='39.7'%20y2='78.2'/%3E%3Cline%20x1='50'%20y1='50'%20x2='24.0'%20y2='65.0'/%3E%3Cline%20x1='50'%20y1='50'%20x2='20.5'%20y2='44.8'/%3E%3Cline%20x1='50'%20y1='50'%20x2='30.7'%20y2='27.0'/%3E%3C/g%3E%3Ccircle%20cx='50'%20cy='50'%20r='9'%20stroke-width='6'%20fill='%230b1017'/%3E%3C/g%3E%3C/svg%3E">
<title>VAULT NINE</title>
<style>/* VAULT NINE - cold industrial HUD. Teal readouts, amber warnings,
   red for damage. Numbers are tabular so they never jitter. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b1017}
body{
  font-family:"Rajdhani","Chakra Petch","Avenir Next",Helvetica,Arial,sans-serif;
  color:#dfe9f2;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  touch-action:none;overscroll-behavior:none;
}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none !important}
:root{
  --teal:#7fe9c4; --amber:#ffb03a; --red:#ff4d3d; --ice:#63d8ff;
  --ink:#0b1017; --panel:rgba(12,18,25,.88); --line:rgba(127,233,196,.22);
}

#combat{position:fixed;inset:0;pointer-events:none;z-index:5}
#vignette{position:absolute;inset:0;opacity:0;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(150,20,15,.75) 100%)}
#scope{position:absolute;inset:0;opacity:0;transition:opacity .10s;
  background:radial-gradient(circle at center,transparent 0 26vh,rgba(0,0,0,.97) 27vh)}
#scope.on{opacity:1}

/* ---- crosshair ---- */
#crosshair{position:absolute;left:50%;top:50%;width:0;height:0;--gap:12px;--ch-col:#7fe9c4;--ch-scale:1}
#crosshair i{position:absolute;background:var(--ch-col);box-shadow:0 0 3px rgba(0,0,0,.9);opacity:.95}
#crosshair .c-t,#crosshair .c-b{width:2px;height:calc(9px * var(--ch-scale));left:-1px}
#crosshair .c-l,#crosshair .c-r{height:2px;width:calc(9px * var(--ch-scale));top:-1px}
#crosshair .c-t{top:calc(var(--gap) * -1 - 9px * var(--ch-scale))}
#crosshair .c-b{top:var(--gap)}
#crosshair .c-l{left:calc(var(--gap) * -1 - 9px * var(--ch-scale))}
#crosshair .c-r{left:var(--gap)}
#crosshair .c-dot{width:2px;height:2px;left:-1px;top:-1px;border-radius:50%;opacity:.5}

#hitmarker{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .05s}
#hitmarker.show{opacity:1}
#hitmarker i{position:absolute;width:11px;height:2px;background:#fff;
  box-shadow:0 0 4px rgba(0,0,0,.9);transform-origin:center}
#hitmarker i:nth-child(1){transform:rotate(45deg) translate(7px,0)}
#hitmarker i:nth-child(2){transform:rotate(-45deg) translate(7px,0)}
#hitmarker i:nth-child(3){transform:rotate(135deg) translate(7px,0)}
#hitmarker i:nth-child(4){transform:rotate(-135deg) translate(7px,0)}
#hitmarker.head i{background:var(--amber)}
#hitmarker.kill i{background:var(--red);width:15px}

/* ---- top bar ---- */
#topbar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;
  display:flex;justify-content:center;gap:clamp(14px,4vw,34px)}
.tb{text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.9);min-width:56px}
.tb span{display:block;font-size:9px;letter-spacing:.22em;color:#7f97ab}
.tb b{display:block;font-size:21px;font-weight:700;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;line-height:1.2}
.tb.score b{color:var(--teal)}
.tb.obj b{color:var(--ice)}
.tb.obj.urgent b{color:var(--red);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

#combo{position:absolute;top:calc(env(safe-area-inset-top) + 74px);left:50%;transform:translateX(-50%);
  font-size:30px;font-weight:800;color:var(--amber);opacity:0;transition:opacity .2s;
  text-shadow:0 0 20px rgba(255,176,58,.6);letter-spacing:.04em}
#combo.show{opacity:1}
#combo.pop{transform:translateX(-50%) scale(1.35)}

#banner{position:absolute;left:0;right:0;top:23%;text-align:center;opacity:0;
  transition:opacity .25s;text-shadow:0 3px 16px rgba(0,0,0,.95)}
#banner.show{opacity:1}
#banner b{display:block;font-size:clamp(26px,6vw,42px);font-weight:800;letter-spacing:.16em;color:var(--amber)}
#banner span{display:block;font-size:11px;letter-spacing:.26em;color:#c8d6e2;margin-top:6px}

#killfeed{position:absolute;right:calc(env(safe-area-inset-right) + 16px);
  top:calc(env(safe-area-inset-top) + 84px);display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.feed-row{background:rgba(10,16,22,.72);border-left:2px solid var(--teal);
  padding:4px 9px;font-size:11px;letter-spacing:.08em;transition:opacity .4s,transform .4s;
  display:flex;gap:7px;align-items:center}
.feed-row.out{opacity:0;transform:translateX(14px)}
.feed-row .fk{color:var(--teal);font-weight:700}
.feed-row .fn{color:#9fb3c4}
.feed-row .mx{color:var(--amber)}

#fps{position:absolute;left:calc(env(safe-area-inset-left) + 14px);
  top:calc(env(safe-area-inset-top) + 10px);font-family:ui-monospace,Menlo,monospace;
  font-size:10px;color:var(--teal);opacity:0;letter-spacing:.06em;text-shadow:0 1px 4px #000}
#fps.on{opacity:.8}
#fps.bad{color:var(--red)}

/* ---- vitals ---- */
#vitals{position:absolute;left:calc(env(safe-area-inset-left) + 18px);
  bottom:calc(env(safe-area-inset-bottom) + 20px);width:min(36vw,210px)}
#hp{position:relative;height:12px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.16);
  clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
#hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#3ddc84,#7fe9c4);transition:width .12s linear}
#hp-num{position:absolute;right:-32px;top:-3px;font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;color:#cfe2ee}
#hp.critical #hp-fill{background:linear-gradient(90deg,#ff3b2f,#ff7a4a);animation:blink .5s steps(2) infinite}
#ar{height:5px;margin-top:4px;background:rgba(0,0,0,.55);border:1px solid rgba(99,216,255,.2);width:82%}
#ar-fill{height:100%;width:0;background:linear-gradient(90deg,#2f9fd6,#63d8ff);transition:width .12s linear}

/* ---- weapon ---- */
#weaponbox{position:absolute;right:calc(env(safe-area-inset-right) + 20px);
  bottom:calc(env(safe-area-inset-bottom) + 128px);text-align:right;text-shadow:0 2px 10px rgba(0,0,0,.95)}
#wname{font-size:11px;letter-spacing:.20em;color:#8fa6b8}
#ammo b{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
#ammo span{font-size:15px;font-weight:600;color:#8fa6b8;margin-left:7px}
#ammo span::before{content:"/ "}
#ammo.low b{color:var(--red)}
#ammo.reloading b{opacity:.35}
#reload-ring{--p:0;height:3px;margin-top:4px;width:84px;margin-left:auto;
  background:rgba(255,255,255,.16);opacity:0;overflow:hidden}
#reload-ring.show{opacity:1}
#reload-ring::after{content:"";display:block;height:100%;width:calc(var(--p) * 100%);background:var(--amber)}
#slots{display:flex;gap:4px;justify-content:flex-end;margin-top:7px}
.slot{font-size:8px;letter-spacing:.10em;color:#5f7385;background:rgba(10,16,22,.6);
  padding:3px 6px;border:1px solid rgba(255,255,255,.08);display:flex;gap:4px;align-items:center}
.slot i{font-style:normal;color:#42566a;font-size:8px}
.slot.active{color:var(--teal);border-color:var(--line);background:rgba(127,233,196,.10)}
.slot.locked{opacity:.3}

/* ---- touch controls ---- */
#controls{position:absolute;inset:0;pointer-events:none}
.pad{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;letter-spacing:.12em;color:#dfe9f2;
  background:rgba(12,18,25,.42);border:1.5px solid rgba(255,255,255,.20);
  border-radius:50%;backdrop-filter:blur(3px);transition:transform .07s,background .07s}
.pad.down{background:rgba(127,233,196,.42);transform:scale(.94);border-color:rgba(127,233,196,.75);color:#062018}
#btn-fire{right:calc(env(safe-area-inset-right) + 18px);
  bottom:calc(env(safe-area-inset-bottom) + 20px);width:84px;height:84px;font-size:13px}
#btn-ads{right:calc(env(safe-area-inset-right) + 114px);
  bottom:calc(env(safe-area-inset-bottom) + 64px);width:60px;height:60px}
.pad.small{width:52px;height:52px;font-size:9px}
#btn-reload{right:calc(env(safe-area-inset-right) + 110px);bottom:calc(env(safe-area-inset-bottom) + 6px)}
#btn-jump{right:calc(env(safe-area-inset-right) + 168px);bottom:calc(env(safe-area-inset-bottom) + 44px)}
#btn-crouch{right:calc(env(safe-area-inset-right) + 168px);bottom:calc(env(safe-area-inset-bottom) + 104px)}
#btn-swap{right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 114px)}
.pad.tiny{width:38px;height:38px;font-size:12px;
  right:calc(env(safe-area-inset-right) + 16px);top:calc(env(safe-area-inset-top) + 52px);
  bottom:auto;letter-spacing:0}

/* On a mouse-and-keyboard machine the touch pads are dead weight sitting on
   top of the canvas, where they swallow clicks meant for the game. The pause
   pad stays because it is the only way back to the menu without Escape. */
@media (hover: hover) and (pointer: fine) {
  #btn-fire,#btn-ads,#btn-crouch,#btn-jump,#btn-reload,#btn-swap{display:none}
}

#stick{position:absolute;width:0;height:0;opacity:0;transition:opacity .12s}
#stick.on{opacity:1}
#stick i{position:absolute;display:block;border-radius:50%;pointer-events:none}
#stick-ring{width:124px;height:124px;left:-62px;top:-62px;
  border:2px solid rgba(255,255,255,.20);background:rgba(12,18,25,.22);backdrop-filter:blur(2px)}
#stick-nub{width:34px;height:34px;left:0;top:0;
  background:rgba(127,233,196,.32);border:1.5px solid rgba(127,233,196,.55)}

/* ---- floating damage ---- */
#floats{position:absolute;inset:0;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font-size:15px;font-weight:700;
  color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.95);animation:rise .85s ease-out forwards;
  white-space:nowrap;letter-spacing:.03em}
.float.head{color:var(--amber)}
.float.big{font-size:18px;letter-spacing:.12em;color:var(--teal)}
.float.head.big{color:var(--amber)}
@keyframes rise{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
  15%{opacity:1;transform:translate(-50%,-58%) scale(1.06)}
  100%{opacity:0;transform:translate(-50%,-135%) scale(1)}
}

/* ---- screens ---- */
#screens{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);
  background:radial-gradient(ellipse at 50% 35%,rgba(24,40,52,.72),rgba(6,10,14,.96))}
.panel{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:11px;
  text-align:center;max-height:100%;overflow-y:auto;padding:4px}
.panel.wide{max-width:440px}
.fade{animation:fadein .25s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.brand{font-size:clamp(30px,8vw,46px);font-weight:800;letter-spacing:.16em;line-height:1}
.brand span{color:#dfe9f2}
.brand b{color:var(--teal);text-shadow:0 0 26px rgba(127,233,196,.45)}
.tagline{font-size:10px;letter-spacing:.20em;text-transform:uppercase;color:#7f97ab}
.h1{font-size:24px;font-weight:800;letter-spacing:.18em;color:var(--teal)}
.sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8fa6b8}
.sec{font-size:9px;letter-spacing:.24em;color:#5f7385;align-self:flex-start;margin-top:6px}
.dead{font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--red);font-weight:800}
.bigscore{font-size:52px;font-weight:800;line-height:1;color:var(--teal);
  font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(127,233,196,.3)}
.best{font-size:11px;letter-spacing:.22em;color:var(--amber);font-weight:800;text-transform:uppercase}

.btn{pointer-events:auto;appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;padding:13px 22px;min-width:200px;
  background:rgba(255,255,255,.06);color:#dfe9f2;border:1px solid rgba(255,255,255,.16);
  transition:transform .07s,background .12s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.btn:hover{background:rgba(127,233,196,.12)}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.32;pointer-events:none}
.btn.primary{background:linear-gradient(180deg,#7fe9c4,#33b491);color:#04231b;border-color:transparent}
.btn.ghost{min-width:140px;padding:10px 16px;font-size:11px;background:transparent;color:#8fa6b8}
.btn.sm{min-width:96px;padding:8px 12px;font-size:10px}
.btn em{font-style:normal;background:var(--amber);color:#221200;padding:1px 6px;margin-left:6px;font-size:10px}
.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}

.modes{display:flex;flex-direction:column;gap:8px;width:100%}
.mode{pointer-events:auto;cursor:pointer;text-align:left;font:inherit;color:#dfe9f2;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);padding:12px 14px;
  display:flex;flex-direction:column;gap:2px;transition:background .12s,border-color .12s;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.mode:hover{background:rgba(127,233,196,.10);border-color:var(--line)}
.mode b{font-size:16px;letter-spacing:.14em;color:var(--teal)}
.mode span{font-size:11px;color:#8fa6b8}
.mode i{font-style:normal;font-size:9px;letter-spacing:.16em;color:#5f7385;margin-top:3px}

.lvlbar{width:100%;background:rgba(255,255,255,.04);padding:9px 11px;border:1px solid rgba(255,255,255,.10)}
.lvlrow{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:#8fa6b8;margin-bottom:5px}
.bar{height:5px;background:rgba(0,0,0,.5);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ice))}
.lvlhint{font-size:10px;color:#5f7385;margin-top:6px;letter-spacing:.06em}
.lvlhint b{color:var(--amber)}

.list{display:flex;flex-direction:column;gap:6px;width:100%}
.gun,.upg{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);padding:9px 11px}
.gun.sel{border-color:var(--line);background:rgba(127,233,196,.09)}
.gun.locked{opacity:.45}
.gn,.un{font-size:13px;font-weight:700;letter-spacing:.06em}
.gs,.ud{font-size:9px;letter-spacing:.08em;color:#7f97ab;margin-top:2px}
.pill{font-size:9px;letter-spacing:.14em;color:var(--amber);white-space:nowrap}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:15px;height:4px;background:rgba(255,255,255,.14)}
.pips i.on{background:var(--teal)}

.opt{width:100%;margin-bottom:9px}
.ol{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.10em;color:#a8bccb;margin-bottom:5px}
.ol b{color:var(--teal);font-variant-numeric:tabular-nums}
.opt input[type=range]{width:100%;accent-color:#7fe9c4;pointer-events:auto;height:18px}
.opt.row-between{font-size:11px;letter-spacing:.10em;color:#a8bccb}
.toggle.on{background:rgba(127,233,196,.18);border-color:var(--line);color:var(--teal)}
.seg{display:flex;gap:3px}
.seg button{pointer-events:auto;cursor:pointer;font:inherit;font-size:9px;letter-spacing:.10em;
  text-transform:uppercase;padding:6px 9px;background:rgba(255,255,255,.05);color:#8fa6b8;
  border:1px solid rgba(255,255,255,.10)}
.seg button.on{background:rgba(127,233,196,.18);color:var(--teal);border-color:var(--line)}
.swatches{display:flex;gap:5px}
.sw{width:22px;height:22px;border:2px solid rgba(255,255,255,.2);cursor:pointer;pointer-events:auto}
.sw.on{border-color:#fff}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.stat{background:rgba(255,255,255,.05);padding:8px 4px}
.stat .k{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#5f7385}
.stat .v{font-size:18px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.xpline{font-size:10px;letter-spacing:.12em;color:#8fa6b8}
.hint{font-size:10px;color:#6f879b;line-height:1.9;letter-spacing:.04em}
.hint b{color:var(--teal)}

@media (max-height:430px){
  .brand{font-size:26px}.bigscore{font-size:34px}.panel{gap:7px}
  .btn{padding:9px 16px;min-width:150px;font-size:11px}
  .hint{display:none}
}


/* ---- campaign HUD ---- */
#objective{position:absolute;left:calc(env(safe-area-inset-left) + 18px);top:76px;
  max-width:340px;padding:9px 12px;background:rgba(10,15,21,.55);
  border-left:2px solid var(--amber);backdrop-filter:blur(3px);
  transition:opacity .35s;pointer-events:none}
#objective.hidden{opacity:0}
#objective .oh{display:block;font-size:9px;letter-spacing:.22em;color:#8fa6b8;margin-bottom:3px}
#objective b{display:block;font-size:13px;letter-spacing:.04em;color:#eef4fa;font-weight:600}
#objective i{display:block;font-style:normal;font-size:10px;color:#9fb3c4;margin-top:3px}
#objective.done b{color:var(--amber)}

#prompt{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;padding:7px 13px;
  background:rgba(10,15,21,.62);border:1px solid rgba(255,255,255,.16);
  font-size:12px;letter-spacing:.08em;color:#eef4fa;transition:opacity .12s;pointer-events:none}
#prompt.hidden{opacity:0}
#prompt em{font-style:normal;font-weight:700;font-size:11px;padding:2px 7px;
  background:#eef4fa;color:#0b1017;border-radius:2px}
#prompt.locked{border-color:rgba(255,59,48,.6);color:#ff9d95}
#prompt.locked em{background:#ff3b30;color:#fff}

#log{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,84vw);padding:20px 24px;background:rgba(8,12,17,.90);
  border:1px solid rgba(255,255,255,.14);border-top:2px solid var(--amber);
  transition:opacity .5s;pointer-events:none}
#log.hidden{opacity:0}
#log b{display:block;font-size:12px;letter-spacing:.20em;color:var(--amber);margin-bottom:11px}
#log #log-lines div{font-size:13px;line-height:1.65;color:#dbe6f0;margin-bottom:5px}

.diffrow{margin:-4px 0 10px;gap:6px}
.diffrow .btn{min-width:74px}


/* ---- contextual touch controls ---- */
.pad.ctx{display:none}
.pad.ctx.show{display:flex}
#btn-interact{right:calc(env(safe-area-inset-right) + 104px);bottom:calc(env(safe-area-inset-bottom) + 168px);
  width:auto;min-width:96px;height:52px;padding:0 16px;border-radius:26px;font-size:12px;
  letter-spacing:.06em;background:rgba(127,233,196,.30);border-color:rgba(127,233,196,.8)}
#btn-interact.locked{background:rgba(255,59,48,.28);border-color:rgba(255,90,80,.8)}
#btn-breath{right:calc(env(safe-area-inset-right) + 212px);bottom:calc(env(safe-area-inset-bottom) + 164px)}
.pad.tiny.inspect{top:calc(env(safe-area-inset-top) + 98px)}

/* On a mouse-and-keyboard machine the touch pads stay hidden, as before. */
@media (hover: hover) and (pointer: fine) {
  #btn-interact,#btn-breath,#btn-inspect{display:none!important}
}

/* Touch devices: the key badge in the prompt means nothing, the USE button
   does the job, and the prompt moves up so a thumb never covers it. */
@media (pointer: coarse) {
  #prompt em{display:none}
  #prompt{bottom:auto;top:62%}
}

/* Portrait phones get a turn-sideways card instead of a squashed game. */
#rotate{display:none}
@media (pointer: coarse) and (orientation: portrait) {
  #rotate{display:flex;position:fixed;inset:0;z-index:9999;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:#0b1017;color:#dfe9f2;
    font:600 15px/1.4 system-ui,sans-serif;letter-spacing:.04em;text-align:center;padding:24px}
  #rotate b{font-size:46px;color:#7fe9c4}
}


/* Campaign: the wave/score cells are arcade furniture. Kills stay. */
#combat.campaign #topbar .tb:not(:last-child){display:none}

/* Phone layout: the USE button sits low, left of the action cluster, clear of
   the ammo counter (which it covered on a 360px-tall screen) and clear of the
   left-hand move stick. Breath stacks above it. */
@media (pointer: coarse) {
  #btn-interact{right:calc(env(safe-area-inset-right) + 236px);bottom:calc(env(safe-area-inset-bottom) + 18px)}
  #btn-breath{right:calc(env(safe-area-inset-right) + 240px);bottom:calc(env(safe-area-inset-bottom) + 82px)}
}

/* Short landscape screens: tighten the menu so the campaign button is in the
   first screenful instead of below the fold. */
@media (max-height: 430px) {
  .brand{font-size:32px!important;margin-bottom:2px!important}
  .tagline{font-size:9px!important;margin-bottom:6px!important}
  .lvlbar{padding:6px 9px!important}
  .mode{padding:8px 12px!important}
}

/* Phones: the story card covers most of a small screen, so a tap closes it. */
@media (pointer: coarse) { #log{pointer-events:auto} }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="rotate"><b>&#8635;</b><span>Turn your phone sideways to play</span></div>

  <div id="combat" class="hidden">
    <div id="vignette"></div>
    <div id="scope"></div>

    <div id="crosshair">
      <i class="c-t"></i><i class="c-b"></i><i class="c-l"></i><i class="c-r"></i><i class="c-dot"></i>
    </div>
    <div id="hitmarker"><i></i><i></i><i></i><i></i></div>

    <div id="topbar">
      <div class="tb"><span>WAVE</span><b id="wave-n">1</b></div>
      <div class="tb obj" id="obj"><span id="obj-label">HOSTILES</span><b id="obj-value">0</b></div>
      <div class="tb score"><span>SCORE</span><b id="score">0</b></div>
      <div class="tb"><span>KILLS</span><b id="kills">0</b></div>
    </div>

    <div id="objective" class="hidden">
      <span class="oh">OBJECTIVE</span>
      <b id="obj-text"></b>
      <i id="obj-hint"></i>
    </div>

    <div id="prompt" class="hidden"><em>E</em><span id="prompt-text">Interact</span></div>

    <div id="log" class="hidden">
      <b id="log-title"></b>
      <div id="log-lines"></div>
    </div>

    <div id="combo"></div>
    <div id="banner"></div>
    <div id="killfeed"></div>
    <div id="fps"></div>

    <div id="vitals">
      <div id="hp"><div id="hp-fill"></div><span id="hp-num">100</span></div>
      <div id="ar"><div id="ar-fill"></div></div>
    </div>

    <div id="weaponbox">
      <div id="wname">VK-7 RIFLE</div>
      <div id="ammo"><b id="ammo-mag">30</b><span id="ammo-res">240</span></div>
      <div id="reload-ring"></div>
      <div id="slots">
        <div class="slot" id="slot-rifle"><i>1</i>RIFLE</div>
        <div class="slot" id="slot-smg"><i>2</i>SMG</div>
        <div class="slot" id="slot-shotgun"><i>3</i>SHOTGUN</div>
        <div class="slot" id="slot-sniper"><i>4</i>SNIPER</div>
      </div>
    </div>

    <div id="controls">
      <div id="btn-pause" class="pad tiny">II</div>
      <!-- Contextual: appears only when there is something to use, labelled
           with what it does, so a phone player is never stuck at a keycard. -->
      <div id="btn-interact" class="pad ctx">USE</div>
      <div id="btn-breath" class="pad ctx small">BREATH</div>
      <div id="btn-inspect" class="pad tiny inspect">&#8635;</div>
      <div id="btn-swap" class="pad small">SWAP</div>
      <div id="btn-crouch" class="pad small">CRCH</div>
      <div id="btn-jump" class="pad small">JUMP</div>
      <div id="btn-reload" class="pad small">RELD</div>
      <div id="btn-ads" class="pad">ADS</div>
      <div id="btn-fire" class="pad fire">FIRE</div>
    </div>

    <div id="stick"><i id="stick-ring"></i><i id="stick-nub"></i></div>
    <div id="floats"></div>
  </div>

  <div id="screens"></div>
