<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VAULT NINE">
<meta name="theme-color" content="#0b1017">
<title>VAULT NINE</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="rotate"><b>&#8635;</b><span>Turn your phone sideways to play</span></div>

  <div id="combat" class="hidden">
    <div id="vignette"></div>
    <div id="scope"></div>

    <div id="crosshair">
      <i class="c-t"></i><i class="c-b"></i><i class="c-l"></i><i class="c-r"></i><i class="c-dot"></i>
    </div>
    <div id="hitmarker"><i></i><i></i><i></i><i></i></div>

    <div id="topbar">
      <div class="tb"><span>WAVE</span><b id="wave-n">1</b></div>
      <div class="tb obj" id="obj"><span id="obj-label">HOSTILES</span><b id="obj-value">0</b></div>
      <div class="tb score"><span>SCORE</span><b id="score">0</b></div>
      <div class="tb"><span>KILLS</span><b id="kills">0</b></div>
    </div>

    <div id="objective" class="hidden">
      <span class="oh">OBJECTIVE</span>
      <b id="obj-text"></b>
      <i id="obj-hint"></i>
    </div>

    <div id="prompt" class="hidden"><em>F</em><span id="prompt-text">Interact</span></div>

    <div id="log" class="hidden">
      <b id="log-title"></b>
      <div id="log-lines"></div>
    </div>

    <div id="combo"></div>
    <div id="banner"></div>
    <div id="killfeed"></div>
    <div id="fps"></div>

    <div id="vitals">
      <div id="hp"><div id="hp-fill"></div><span id="hp-num">100</span></div>
      <div id="ar"><div id="ar-fill"></div></div>
      <div id="gearrow">
        <span id="g-plates"><em>B</em>PLATE <b>0</b></span>
        <span id="g-meds"><em>H</em>MED <b>0</b></span>
        <span id="g-frags"><em>G</em>FRAG <b>0</b></span>
        <span id="g-smokes"><em>T</em>SMOKE <b>0</b></span>
      </div>
    </div>
    <div id="itembar"><span id="item-name"></span><i></i></div>
    <div id="toast"></div>

    <div id="weaponbox">
      <div id="wname">VK-7 RIFLE</div>
      <div id="ammo"><b id="ammo-mag">30</b><span id="ammo-res">240</span></div>
      <div id="reload-ring"></div>
      <div id="slots">
        <div class="slot" id="slot-rifle"><i>1</i>RIFLE</div>
        <div class="slot" id="slot-smg"><i>2</i>SMG</div>
        <div class="slot" id="slot-shotgun"><i>3</i>SHOTGUN</div>
        <div class="slot" id="slot-sniper"><i>4</i>SNIPER</div>
        <div class="slot" id="slot-pistol"><i>5</i>P9</div>
      </div>
      <div id="zero" class="hidden">ZERO <b>100</b> m <em>[ ]</em></div>
      <div id="atts"></div>
    </div>

    <div id="controls">
      <div id="btn-pause" class="pad tiny">II</div>
      <!-- Contextual: appears only when there is something to use, labelled
           with what it does, so a phone player is never stuck at a keycard. -->
      <div id="btn-interact" class="pad ctx">USE</div>
      <div id="btn-breath" class="pad ctx small">BREATH</div>
      <div id="btn-inspect" class="pad tiny inspect">&#8635;</div>
      <div id="btn-swap" class="pad small">SWAP</div>
      <div id="btn-leanl" class="pad small lean">&#9664;</div>
      <div id="btn-leanr" class="pad small lean">&#9654;</div>
      <div id="btn-prone" class="pad small">PRONE</div>
      <div id="btn-tac" class="pad ctx small">DASH</div>
      <div id="btn-nade" class="pad small">NADE</div>
      <div id="btn-bag" class="pad tiny bag">BAG</div>
      <div id="btn-crouch" class="pad small">CRCH</div>
      <div id="btn-jump" class="pad small">JUMP</div>
      <div id="btn-reload" class="pad small">RELD</div>
      <div id="btn-ads" class="pad">ADS</div>
      <div id="btn-fire" class="pad fire">FIRE</div>
    </div>

    <div id="stick"><i id="stick-ring"></i><i id="stick-nub"></i></div>
    <div id="floats"></div>
  </div>

  <div id="screens"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
